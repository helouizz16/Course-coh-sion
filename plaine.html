<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étape - La Plaine</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

/* Boutons équipes verts */
.teams button {
    display: block;
    width: 100%;
    margin: 12px 0;
    padding: 16px;
    font-size: 1.15rem;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 6px 14px rgba(34, 197, 94, 0.25);
}

.teams button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 18px rgba(34, 197, 94, 0.35);
}

.teams button:active {
    transform: scale(0.97);
}

/* Section cachée */
.hidden {
    display: none;
}

.message-final {
    opacity: 0;
    transform: translateY(20px);
    transition: 0.8s ease;
    margin-top: 25px;
    font-size: 1.4rem;
    font-weight: bold;
    color: #22c55e;
}

.message-final.visible {
    opacity: 1;
    transform: translateY(0);
}

/* 🎉 Confettis */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    opacity: 0.8;
    animation: fall linear forwards;
    z-index: 9999;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>🌾 Étape : La Plaine</h1>
    <p>Choisissez votre équipe :</p>

    <!-- Faux choix équipe -->
    <div class="teams" id="teamSelect">
        <button onclick="startTrap()">FC Cherche Encore </button>
        <button onclick="startTrap()">FC Crampons Perdus </button>
        <button onclick="startTrap()">FC C'est Pas Gagné </button>
        <button onclick="startTrap()">FC Les Perdus du Terrain</button>
    </div>

    <!-- Piège vidéo -->
    <div id="trap" class="hidden">
        <h2>Chargement de l'étape...</h2>

        <!-- Bloc vidéo YouTube -->
        <div id="videoBlock">
            <iframe width="100%" height="500"
                src="https://view.page/p/SiT62l"
                title="Vidéo fin de parcours"
                frameborder="0"
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>
        </div>

        <!-- Message final -->
        <div id="message" class="message-final">
            🎉 Félicitations ! Vous avez terminé le parcours 🎯<br><br>
            Merci d'avoir regardé cette vidéo jusqu'au bout ! 🙌<br><br>
            👉 Vous pouvez maintenant revenir au local.
        </div>
    </div>

</div>

<script>
function startTrap() {
    // Cache les boutons
    document.getElementById("teamSelect").style.display = "none";

    // Affiche la zone piège
    document.getElementById("trap").classList.remove("hidden");

    // Timer fin vidéo (~20s ou durée exacte de la vidéo)
    setTimeout(endSequence, 74000);
}

// 🎬 FIN DE SÉQUENCE
function endSequence() {
    // 💥 Supprime le player YouTube
    const video = document.getElementById("videoBlock");
    if (video) video.remove();

    // Affiche le message
    document.getElementById("message").classList.add("visible");

    // Effets
    launchConfetti();
    vibratePhone();
}

// 🎉 Confettis
function launchConfetti() {
    const colors = ["#f43f5e", "#22c55e", "#3b82f6", "#eab308", "#a855f7"];

    for (let i = 0; i < 120; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";

        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
    }
}

// 📳 Vibration téléphone
function vibratePhone() {
    if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 400]);
    }
}
</script>

</body>
</html>
